<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebNav Hub · 常用网址导航</title>
  <meta name="description" content="简洁、快速、可自定义的网址导航页，收录 AI 搜索、托管社交、实用工具、科技资讯、云存储与电子邮箱常用站点。">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="header-inner">
      <h1>WebNav Hub</h1>
      <p class="tagline">常用网址，一页直达</p>
    </div>
  </header>

  <nav class="site-nav" aria-label="分类导航">
    <ul id="category-nav"></ul>
  </nav>

  <main id="main" tabindex="-1">
    <div id="load-status" class="status is-loading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text">正在加载链接…</span>
      <button id="retry" type="button" class="btn btn-ghost btn-small" hidden>重试</button>
    </div>

    <section id="ai-search">
      <h2 class="category-title">AI 搜索</h2>
      <div class="link-grid"></div>
    </section>

    <section id="social">
      <h2 class="category-title">托管社交</h2>
      <div class="link-grid"></div>
    </section>

    <section id="tools">
      <h2 class="category-title">实用工具</h2>
      <div class="link-grid"></div>
    </section>

    <section id="tech-news">
      <h2 class="category-title">科技资讯</h2>
      <div class="link-grid"></div>
    </section>

    <section id="cloud-storage">
      <h2 class="category-title">云存储</h2>
      <div class="link-grid"></div>
    </section>

    <section id="email">
      <h2 class="category-title">电子邮箱</h2>
      <div class="link-grid"></div>
    </section>

    <noscript>
      <p class="status is-error">本站需要启用 JavaScript 才能加载链接列表。</p>
    </noscript>
  </main>

  <footer>
    <p>&copy; <span id="year">2026</span> WebNav Hub · 基于 Cloudflare Pages 构建</p>
  </footer>

  <div class="float-stack">
    <button id="add-link" class="btn btn-primary float-btn float-add" type="button">
      <i class="fas fa-plus" aria-hidden="true"></i>
      <span>添加链接</span>
    </button>
    <button id="toggle-edit" class="btn float-btn float-toggle" type="button" aria-pressed="false">
      <i id="toggle-icon" class="fas fa-edit" aria-hidden="true"></i>
      <span id="toggle-label">管理</span>
    </button>
  </div>

  <dialog id="edit-dialog" aria-labelledby="dialog-title">
    <form id="link-form" novalidate>
      <div class="dialog-header">
        <h2 id="dialog-title">添加链接</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </div>

      <p id="dialog-summary" class="dialog-summary" hidden></p>

      <label class="field">
        <span>编辑密码</span>
        <input id="edit-password" name="password" type="password" autocomplete="current-password" placeholder="请输入 EDIT_PASSWORD">
      </label>

      <div id="link-fields">
        <label class="field">
          <span>标题</span>
          <input id="title" name="title" type="text" maxlength="60" autocomplete="off" placeholder="例如：Cloudflare">
        </label>
        <label class="field">
          <span>网址</span>
          <input id="url" name="url" type="text" inputmode="url" autocomplete="off" placeholder="https://example.com">
        </label>
        <label class="field">
          <span>分类</span>
          <select id="category" name="category"></select>
        </label>
        <label class="field">
          <span>图标类名</span>
          <input id="icon" name="icon" type="text" autocomplete="off" placeholder="fas fa-globe">
          <small class="hint">使用 Font Awesome 类名，例如 fa-solid fa-globe，留空则使用默认图标。</small>
        </label>
      </div>

      <p id="form-message" class="form-message" role="status"></p>

      <div class="dialog-actions">
        <button type="button" id="delete-link" class="btn btn-danger" hidden>确认删除</button>
        <button type="button" id="cancel-edit" class="btn btn-ghost" hidden>取消编辑</button>
        <button type="submit" id="save-link" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
